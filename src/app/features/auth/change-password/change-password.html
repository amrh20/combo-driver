<main class="change-password driver-page d-flex align-items-center">
  <section class="change-password__card driver-card combo-p-24">
    <a class="change-password__back combo-fs-13 font-medium" routerLink="/auth/login">
      الرجوع لتسجيل الدخول
    </a>

    <h1 class="change-password__title font-kufam combo-fs-26 font-bold combo-mt-24 combo-mb-8">
      تغيير كلمة المرور
    </h1>
    <p class="change-password__subtitle combo-fs-14 combo-mb-28">
      استخدم كلمة مرور قوية لتأمين حساب الكابتن.
    </p>

    <form class="d-flex flex-column gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <div class="driver-field">
        <label for="currentPassword">كلمة المرور الحالية</label>
        <combo-password-input
          id="currentPassword"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
      </div>

      <div class="driver-field">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <combo-password-input
          id="newPassword"
          formControlName="newPassword"
          autocomplete="new-password"
        />
      </div>

      <div class="driver-field">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <combo-password-input
          id="confirmPassword"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
      </div>

      @if (statusMessage()) {
        <p class="change-password__status combo-fs-13 combo-m-0" [class.change-password__status--success]="hasSuccess()">
          {{ statusMessage() }}
        </p>
      }

      <combo-button type="submit" size="lg" [fullWidth]="true">
        حفظ كلمة المرور
      </combo-button>
    </form>
  </section>
</main>
