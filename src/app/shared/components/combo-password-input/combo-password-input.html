<div class="password-input">
  <input
    #field
    class="password-input__field"
    [id]="id()"
    [type]="visible() ? 'text' : 'password'"
    [attr.autocomplete]="autocomplete()"
    [attr.placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="markTouched()"
  />

  <button
    type="button"
    class="password-input__toggle"
    [attr.aria-pressed]="visible()"
    [attr.aria-label]="visible() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
    [disabled]="disabled()"
    (click)="toggleVisibility()"
  >
    @if (visible()) {
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M3 3.75 21 20.25"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <path
          d="M9.88 9.88a3 3 0 0 0 4.24 4.24M6.1 6.36C4.05 7.7 2.55 9.64 1.5 12c0 0 3.75 6.75 10.5 6.75 1.86 0 3.55-.45 5.02-1.2M10.2 5.48c.58-.15 1.18-.23 1.8-.23 6.75 0 10.5 6.75 10.5 6.75a18.2 18.2 0 0 1-2.55 3.37"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M1.5 12S5.25 5.25 12 5.25 22.5 12 22.5 12 18.75 18.75 12 18.75 1.5 12 1.5 12Z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
      </svg>
    }
  </button>
</div>
